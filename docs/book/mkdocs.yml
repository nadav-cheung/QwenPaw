# MKDocs 配置文件 - 《QwenPaw智能体开发实战》

site_name: "QwenPaw智能体开发实战"
site_description: "Java开发者的AI Agent转型指南"
site_author: "QwenPaw Community"
site_url: "https://qwenpaw.github.io/book/"

repo_name: "QwenPaw/QwenPaw"
repo_url: "https://github.com/QwenPaw/QwenPaw"

theme:
  name: "material"
  language: "zh"
  palette:
    primary: "blue"
    accent: "light blue"
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy

plugins:
  - search:
      lang:
        - en
        - zh
  - minify:
      minify_html: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.tab:
      enabled: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html

nav:
  - 入门篇:
    - "1.1 QwenPaw概述": "part1-intro/1.1-qwenpaw-overview.md"
    - "1.2 环境搭建": "part1-intro/1.2-environment-setup.md"
    - "1.3 Java开发者的Python指南": "part1-intro/1.3-python-guide.md"
    - "1.4 智能体核心概念": "part1-intro/1.4-agent-core-concepts.md"
    - "1.5 技能系统入门": "part1-intro/1.5-skill-system.md"
    - "1.6 消息渠道基础": "part1-intro/1.6-channel-basics.md"
  - 进阶篇-核心机制:
    - "2.1 Agent核心架构": "part2-advanced/core/2.1-agent-core.md"
    - "2.2 Runner与请求处理": "part2-advanced/core/2.2-runner-request.md"
    - "2.3 Memory记忆系统": "part2-advanced/core/2.3-memory-system.md"
    - "2.4 Provider与模型层": "part2-advanced/core/2.4-provider-model.md"
    - "2.5 Channel消息渠道": "part2-advanced/core/2.5-channel.md"
    - "2.6 Guard安全系统": "part2-advanced/core/2.6-guard-security.md"
    - "2.7 Skill技能系统": "part2-advanced/core/2.7-skill-system.md"
    - "2.8 MCP扩展机制": "part2-advanced/core/2.8-mcp.md"
